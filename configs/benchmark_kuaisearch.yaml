  mini:
    tier: "mini"
    target_corpus_size: 100000
    max_users: 16000
    use_rank_prehistory: false
    max_hist_queries: 15
    max_hist_items: 20
    val_ratio: 0.05
    seed: 42
  scale:
    tier: "scale"
    target_corpus_size: 500000
    use_rank_prehistory: false
    max_hist_queries: 15
    max_hist_items: 20
    val_ratio: 0.05
    seed: 42
